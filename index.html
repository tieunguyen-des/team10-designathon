<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mây · Onboarding prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:wght@400;500;600&display=swap">
<style>
:root{--cream:#F6F0E6;--ink:#2E241B;--primary:#8F755A;--primary-d:#7E654B;--line:#D6CBB9;--card:#2A1D14;--serif:'Cormorant Garamond','Times New Roman',serif;--sans:'Manrope',system-ui,sans-serif;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#14100c;font-family:var(--sans);color:var(--ink);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#stage{height:100%;display:flex;align-items:center;justify-content:center;gap:40px;padding:12px}
#side{width:220px;color:#e9dfd0;display:flex;flex-direction:column;gap:14px}
#side h1{font-family:var(--serif);font-weight:500;font-size:34px;letter-spacing:.02em}
#side p{font-size:12px;line-height:1.6;color:#a89c8a}
.seg{display:flex;flex-direction:column;gap:8px}
.seg button{border:1px solid #4a3f33;padding:12px 14px;text-align:left;font-size:13px;color:#cdbfaa;transition:.3s}
.seg button b{display:block;font-weight:600;color:#f2e8d8;margin-bottom:2px}
.seg button.on{border-color:#B79B7C;background:rgba(183,155,124,.14)}
#restart{border:1px solid #4a3f33;padding:10px;font-size:12px;color:#cdbfaa;letter-spacing:.08em;text-transform:uppercase}
#wrap{width:390px;height:844px;flex:none;transform-origin:center center}
#phone{position:relative;width:390px;height:844px;overflow:hidden;background:var(--cream);box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px #3a2f25}
@media(max-width:700px){#side{display:none}}

/* screens */
.screen{position:absolute;inset:0;overflow:hidden;opacity:0;pointer-events:none;transform:translateX(30px);transition:opacity .45s ease,transform .6s var(--ease);background:var(--cream)}
.screen.out-l{transform:translateX(-30px)}
.screen.on{opacity:1;pointer-events:auto;transform:none}
.screen.nt{transition:none}
.screen:not(.on) *{pointer-events:none!important}
.rise{opacity:0}
.screen.on .rise{animation:rise .75s var(--ease) both;animation-delay:calc(var(--i,0)*70ms + 120ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.sb{position:absolute;top:0;left:0;right:0;height:44px;display:flex;justify-content:space-between;align-items:center;padding:6px 28px 0;font-size:15px;font-weight:600;z-index:5}
.sb svg{height:11px}
.light .sb,.sb.light{color:#fff}
.hdr{position:absolute;top:44px;left:0;right:0;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;z-index:5}
.hdr button{width:28px;height:28px;display:grid;place-items:center}
.logo{font-family:var(--serif);font-size:30px;line-height:.8;text-align:center;font-weight:500}
.logo small{display:block;font-family:var(--sans);font-size:6.5px;letter-spacing:.2em;margin-top:3px}
.light .hdr{color:#fff}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:500}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:52px;font-size:14px;font-weight:500;letter-spacing:.01em;transition:transform .25s var(--ease),background .3s,opacity .3s}
.btn:active{transform:scale(.985)}
.btn.pri{background:var(--primary);color:#fff;position:relative}
.btn.pri:hover{background:var(--primary-d)}
.btn.pri i{position:absolute;right:6px;top:6px;bottom:6px;width:40px;border:1px solid rgba(255,255,255,.4);display:grid;place-items:center;font-style:normal}
.btn.sec{border:1px solid var(--line);color:var(--ink);background:rgba(255,255,255,.35)}
.btn.sec:hover{background:rgba(255,255,255,.7)}

/* A1 / O7 */
.peach{background:linear-gradient(180deg,var(--tint,#FCE8D2) 0%,#F7EEE3 55%,#F6F0E6 100%);transition:--tint .6s}
.stageorb{position:absolute;left:0;right:0;top:92px;height:260px;display:grid;place-items:center}
.orb{position:relative;width:216px;height:216px;border-radius:50%;animation:float 5s ease-in-out infinite;transition:transform .5s var(--ease),opacity .35s,filter .35s}
.orb.sm{width:168px;height:168px}
.orb::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 30% 22%,rgba(255,255,255,.95),rgba(255,255,255,.25) 32%,rgba(255,240,215,.12) 62%,rgba(255,255,255,.55) 98%);border:1px solid rgba(255,255,255,.8);box-shadow:inset 0 -18px 40px rgba(255,210,150,.35),0 20px 40px rgba(143,117,90,.18);z-index:2}
.orb svg{position:absolute;inset:14%;width:72%;height:72%;z-index:1;animation:spin 40s linear infinite}
.orb .dot{position:absolute;border-radius:50%;background:rgba(255,255,255,.7);z-index:3;animation:bub 4s ease-in-out infinite}
.orb.swapout{transform:scale(.82) rotate(-8deg);opacity:0;filter:blur(6px)}
.orbshadow{position:absolute;left:50%;top:228px;width:170px;height:20px;margin-left:-85px;border-radius:50%;background:radial-gradient(closest-side,rgba(120,90,60,.35),transparent);animation:shadow 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-9px)}}
@keyframes shadow{50%{transform:scale(.85);opacity:.6}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bub{50%{transform:translateY(-5px) scale(1.2)}}
.thumbs{position:absolute;top:340px;left:0;right:0;display:flex;justify-content:center;gap:14px}
.thumb{width:46px;height:46px;border-radius:50%;position:relative;transition:transform .4s var(--ease)}
.thumb::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.95),rgba(255,255,255,.3) 70%);border:1px solid rgba(255,255,255,.9);box-shadow:0 4px 12px rgba(143,117,90,.15);z-index:2}
.thumb svg{position:absolute;inset:20%;width:60%;height:60%}
.thumb.on{transform:scale(1.18)}
.thumb.on::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1px solid var(--primary);animation:ring .5s var(--ease)}
@keyframes ring{from{transform:scale(.7);opacity:0}}
.copy{position:absolute;left:20px;right:20px;top:424px;transition:opacity .25s,transform .35s var(--ease)}
.copy.swap{opacity:0;transform:translateY(10px)}
.copy .eyebrow{color:#6d5a47;margin-bottom:10px}
.copy h2{font-family:var(--serif);font-weight:500;font-size:34px;line-height:1.05;margin-bottom:14px}
.copy p{font-size:15px;line-height:1.55;color:#4a3c2e}
.cta{position:absolute;left:20px;right:20px;bottom:36px;display:flex;flex-direction:column;gap:12px}

/* B1 */
.photo{position:absolute;inset:0;background:radial-gradient(60% 40% at 78% 28%,rgba(210,160,95,.75),transparent 70%),radial-gradient(50% 36% at 20% 18%,rgba(70,100,55,.85),transparent 70%),radial-gradient(70% 40% at 40% 55%,rgba(235,222,205,.9),transparent 65%),linear-gradient(180deg,#2c3a22,#4b3a24 60%,#1e1610);animation:drift 18s ease-in-out infinite alternate;background-size:130% 130%}
@keyframes drift{to{background-position:30% 20%;filter:hue-rotate(-8deg)}}
.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,14,8,.25) 0%,transparent 35%,rgba(20,12,6,.88) 100%);backdrop-filter:blur(1.5px)}
.towel{position:absolute;left:34px;top:226px;width:210px;height:130px;border-radius:60% 40% 50% 50%;background:linear-gradient(135deg,#faf5ee,#dcd3c6);transform:rotate(-12deg);box-shadow:0 30px 60px rgba(0,0,0,.35);animation:towel 7s ease-in-out infinite alternate}
@keyframes towel{to{transform:rotate(-8deg) translateY(-8px)}}
.b1copy{position:absolute;left:20px;right:20px;bottom:150px;color:#fff}
.b1copy .eyebrow{font-size:10px;margin-bottom:14px;opacity:.85}
.b1copy h1{font-family:var(--serif);font-weight:500;font-size:40px;line-height:1.02;margin-bottom:12px}
.b1copy p{font-size:14px;opacity:.9}

/* Q screens */
.qtitle{position:absolute;left:20px;right:20px;top:112px}
.qtitle .eyebrow{color:#5a4a3a;margin-bottom:12px;font-size:11px}
.qtitle h1{font-family:var(--serif);font-weight:500;font-size:40px;line-height:1.08}
.qcard{position:absolute;left:20px;top:262px;width:350px;height:490px;padding:16px;display:flex;flex-direction:column;color:#fff;overflow:hidden;background:#2a1d14}
.qcard::before{content:"";position:absolute;inset:-20%;background:radial-gradient(40% 30% at 70% 25%,rgba(214,160,96,.55),transparent 70%),radial-gradient(45% 35% at 20% 60%,rgba(120,80,45,.7),transparent 70%),radial-gradient(40% 30% at 80% 80%,rgba(180,120,70,.4),transparent 70%),linear-gradient(160deg,#3a2a1d,#1f150e);filter:blur(24px);animation:cardflow 14s ease-in-out infinite alternate}
@keyframes cardflow{to{transform:translate(6%,4%) scale(1.1) rotate(4deg)}}
.qcard>*{position:relative}
.qcard .eyebrow{font-size:11px;opacity:.85;margin-bottom:8px}
.qcard h2{font-family:var(--serif);font-weight:500;font-size:32px;line-height:1.05;margin-bottom:10px}
.qcard .sub{font-size:12px;opacity:.85}
.qcard .btn{margin-top:auto;background:rgba(244,236,224,.94);color:var(--ink);opacity:.5;pointer-events:none}
.qcard .btn.ready{opacity:1;pointer-events:auto}
.qcard .btn.ready:hover{background:#fff}
.dots{position:absolute;left:0;right:0;top:782px;display:flex;justify-content:center;gap:16px}
.dots i{width:8px;height:8px;border-radius:50%;background:#cfc4b2;transition:.5s var(--ease)}
.dots i.on{background:#6d5a47;transform:scale(1.15)}
.dots i.done{background:#a79278}

/* Q1 carousel */
.track{position:relative;height:200px;margin:18px -16px 0;overflow:hidden}
.tile{position:absolute;transition:left .6s var(--ease),top .6s var(--ease),width .6s var(--ease),height .6s var(--ease),opacity .5s,filter .5s;cursor:pointer}
.tile svg{width:100%;height:100%;display:block;filter:drop-shadow(0 10px 18px rgba(0,0,0,.35));animation:bob 4s ease-in-out infinite}
.tile.c svg{animation-duration:3.2s}
@keyframes bob{50%{transform:translateY(-4px)}}
.mood{text-align:center;font-family:var(--serif);font-size:26px;height:34px;margin-top:6px;position:relative}
.mood span{position:absolute;left:0;right:0;transition:opacity .35s,transform .5s var(--ease)}
.mood .o{opacity:0;transform:translateY(8px)}
.moodsub{text-align:center;font-size:12px;opacity:.8;margin-top:2px;min-height:18px;transition:opacity .3s}

/* Q2 */
.opts{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.opt{display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 16px;border:1px solid rgba(255,255,255,.55);font-family:var(--serif);font-size:20px;text-align:left;transition:background .35s,border-color .35s,transform .3s var(--ease)}
.opt:hover{border-color:#fff}
.opt .r{width:18px;height:18px;border-radius:50%;border:1px solid rgba(255,255,255,.8);position:relative;transition:.3s}
.opt .r::after{content:"";position:absolute;inset:3px;border-radius:50%;background:#fff;transform:scale(0);transition:transform .35s var(--ease)}
.opt.on{background:rgba(255,255,255,.16);border-color:#fff;transform:translateX(4px)}
.opt.on .r{border-color:#fff}.opt.on .r::after{transform:scale(1)}
.allergens{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;max-height:0;opacity:0;overflow:hidden;transition:max-height .6s var(--ease),opacity .4s,margin .4s}
.allergens.show{max-height:120px;opacity:1}
.allergens small{width:100%;font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.chip{border:1px solid rgba(255,255,255,.5);padding:7px 12px;font-size:12px;transition:.3s}
.chip.on{background:#fff;color:var(--ink);border-color:#fff}

/* Q3 dial */
.dial{position:relative;width:318px;height:300px;margin:0 auto -34px;touch-action:none;transform:scale(.88);transform-origin:top center}
.dial svg{position:absolute;inset:0;overflow:visible}
.dial .num{position:absolute;left:0;right:0;top:112px;text-align:center;font-family:var(--serif);font-size:64px;line-height:1;color:var(--ink)}
.dial .num small{display:block;font-family:var(--sans);font-size:11px;letter-spacing:.12em;margin-top:2px}
.dial .lab{position:absolute;font-size:12px;transform:translate(-50%,-50%);padding:6px;cursor:pointer;transition:opacity .3s}
.dial .lab.on{font-weight:600}
.hint{text-align:center;font-size:12px;opacity:.85;margin:0 0 12px;position:relative;z-index:2}

/* O6 */
#o6{background:#E2D2BA}
.cloud{position:absolute;border-radius:50%;background:radial-gradient(circle,#fffdf7 0%,#fff8ea 58%,rgba(255,248,234,0) 74%);filter:blur(8px);transform:scale(0);opacity:0}
#o6.on .cloud{animation:cloud 2.2s var(--ease) forwards;animation-delay:calc(var(--d)*1ms)}
@keyframes cloud{0%{transform:translate(0,40px) scale(0);opacity:0}30%{opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(var(--s));opacity:1}}
#o6 .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;z-index:4}
#o6 .logo{font-size:56px}
#o6 .msg{font-family:var(--serif);font-style:italic;font-size:22px;height:30px;position:relative;width:100%}
#o6 .msg span{position:absolute;left:0;right:0;opacity:0}
#o6.on .msg span{animation:msg 1.1s ease both;animation-delay:calc(var(--k)*900ms + 200ms)}
@keyframes msg{0%{opacity:0;transform:translateY(8px)}30%,70%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-6px)}}

/* O7 */
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tag{border:1px solid var(--line);padding:6px 10px;font-size:11px;letter-spacing:.02em;background:rgba(255,255,255,.5);color:#5a4a3a}
.tag s{color:#a0624f}
.ritual{position:absolute;left:20px;right:20px;top:612px;height:0}
.rcard{position:relative;height:118px;margin-top:0;padding:14px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;background:linear-gradient(120deg,#3b2c1f,#6b5236 70%,#3b2c1f);background-size:200% 100%;animation:shine 9s linear infinite}
@keyframes shine{to{background-position:-200% 0}}
.rcard .tg{position:absolute;left:14px;top:14px;border:1px solid rgba(255,255,255,.7);font-size:8px;letter-spacing:.12em;padding:4px 8px;backdrop-filter:blur(6px)}
.rcard h3{font-family:var(--serif);font-weight:500;font-size:22px}
.rcard p{font-size:12px;opacity:.9;margin-top:2px}
.lbl{font-size:11px;letter-spacing:.06em;color:#6d5a47;text-transform:uppercase;margin-bottom:10px}
.sheet-bg{position:absolute;inset:0;background:rgba(30,20,12,.35);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .45s;z-index:20}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--cream);padding:26px 20px 30px;transform:translateY(105%);transition:transform .6s var(--ease)}
.sheet-bg.on .sheet{transform:none}
.sheet h3{font-family:var(--serif);font-weight:500;font-size:30px;line-height:1.05;margin:8px 0 10px}
.sheet p{font-size:14px;line-height:1.55;color:#4a3c2e;margin-bottom:16px}
.swapline{display:flex;align-items:center;gap:10px;border:1px solid var(--line);padding:12px 14px;margin-bottom:18px;font-size:13px}
.swapline s{color:#a0624f}.swapline b{font-weight:600}
.swapline span{margin-left:auto}
.list{position:absolute;left:20px;right:20px;top:120px;display:flex;flex-direction:column;gap:12px}
.list h1{font-family:var(--serif);font-weight:500;font-size:38px;margin-bottom:6px}
.row{border:1px solid var(--line);padding:16px;display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.4);transition:.3s}
.row:hover{border-color:var(--primary);background:#fff}
.row h3{font-family:var(--serif);font-weight:500;font-size:22px}.row p{font-size:12px;color:#6d5a47;margin-top:2px}
.slots{display:flex;gap:10px;flex-wrap:wrap}
.slots button{border:1px solid var(--line);padding:12px 16px;font-size:13px;transition:.3s}
.slots button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
#toast{position:absolute;left:20px;right:20px;bottom:110px;background:#2E241B;color:#fff;padding:14px 16px;font-size:13px;transform:translateY(30px);opacity:0;transition:.5s var(--ease);z-index:30;pointer-events:none}
#toast.on{transform:none;opacity:1}
.prog{display:flex;gap:6px;margin:14px 0 22px}.prog i{height:2px;flex:1;background:var(--line)}.prog i.on{background:var(--primary)}

/* ===== fidelity pass (Figma geometry) ===== */
:root{--ink:#1C1610;--peach:#FCECD6}
.sb{height:46px;padding:13px 26px 0 26px;align-items:flex-start}
.sb span{line-height:20px}.sb svg{margin-top:4px;width:50px;height:12px}
.hdr{top:46px;height:52px;padding:0 20px}
.hdr button{width:20px;height:20px}
.logo{font-size:30px}
.btn{height:48px;font-size:14px}
.btn.pri i{display:none}
.btn.sec{background:rgba(255,255,255,.35);border:1px solid #E3D6C2}
.peach{background:linear-gradient(180deg,var(--peach) 0,var(--peach) 52%,#F9EFE1 100%)}
.stageorb{display:none}
.orbimg{position:absolute;left:18px;top:86px;width:354px;transition:transform .55s var(--ease),opacity .4s,filter .4s;animation:float 5.5s ease-in-out infinite}
.orbimg.swapout{transform:scale(.9);opacity:0;filter:blur(6px)}
.thumbs{top:403px;left:55px;right:auto;width:280px;gap:0}
.thumb{width:70px;height:72px;border-radius:0}
.thumb::before,.thumb::after{display:none!important}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;opacity:.7;transition:opacity .4s,transform .45s var(--ease)}
.thumb.on img{opacity:1;transform:scale(1.14)}
.copy{left:20px;right:20px;top:514px}
.copy .eyebrow{color:var(--ink);margin-bottom:6px}
.copy h2{font-size:32px;line-height:38px;margin-bottom:16px;letter-spacing:-.01em}
.copy p{font-size:16px;line-height:24px;letter-spacing:-.022em;color:var(--ink)}
.cta{left:20px;right:20px;bottom:32px;gap:12px}
.eyebrow{font-size:12px;line-height:16px;letter-spacing:.02em}
/* B1 */
.b1photo{position:absolute;inset:0;background:radial-gradient(60% 40% at 78% 26%,rgba(214,166,100,.8),transparent 70%),radial-gradient(50% 36% at 18% 14%,rgba(66,96,52,.9),transparent 70%),radial-gradient(70% 38% at 38% 42%,rgba(238,226,210,.95),transparent 66%),linear-gradient(180deg,#2c3a22,#4b3a24 60%,#1e1610)}
.b1photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.b1panel{position:absolute;left:0;right:0;top:536px;height:308px;background:linear-gradient(180deg,rgba(40,34,20,0),rgba(40,34,20,.55) 40%,rgba(32,28,16,.85));backdrop-filter:blur(14px);-webkit-mask-image:linear-gradient(180deg,transparent,#000 35%);mask-image:linear-gradient(180deg,transparent,#000 35%)}
.b1copy{left:25px;right:23px;top:618px;bottom:auto}
.b1copy .eyebrow{font-size:10px;line-height:16px;margin-bottom:20px;letter-spacing:.012em}
.b1copy h1{font-size:32px;line-height:34px;margin-bottom:14px}
.b1copy p{font-size:14px}
#b1 .hdr{top:46px;height:80px;align-items:flex-start;padding-top:20px}
#b1 .hdr .logo{position:absolute;left:20px;top:20px;transform:none;text-align:left}
#b1 .hdr .logo small{text-align:left}
#b1 .hdr [data-exit]{position:absolute;right:26px;top:24px}
#b1 .cta{left:25px;right:23px;bottom:55px}
/* Q */
.qtitle{left:20px;right:20px;top:122px}
.qtitle .eyebrow{margin-bottom:6px;color:var(--ink);font-size:12px}
.qtitle h1{font-size:40px;line-height:48px;letter-spacing:-.046em;color:var(--ink)}
.peekL,.peekR{position:absolute;top:291px;width:350px;height:493px;border-radius:16px;opacity:.7}
.peekL{left:-330px;background:#686356}.peekR{left:370px;background:rgba(38,26,0,.59)}
.qcard{left:20px;top:282px;width:350px;height:493px;padding:0;border-radius:16px;box-shadow:0 14px 15px rgba(28,22,16,.25);display:block}
.qcard .h{position:absolute;left:16px;top:16px;width:318px}
.qcard .eyebrow{color:#fff;opacity:1;margin-bottom:6px;font-size:12px}
.qcard h2{font-size:32px;line-height:34px;margin-bottom:8px;letter-spacing:-.01em}
.qcard .sub{font-size:12px;line-height:16px;opacity:.9}
.qcard .btn{position:absolute;left:16px;top:429px;width:318px;height:48px;margin:0;border-radius:8px;background:#F1E9DD;color:#5C4936;opacity:.55}
.qcard .btn.ready{opacity:1}
.qcard::before{border-radius:16px}
.qimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.qshade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(40,26,12,.55),rgba(30,20,10,.7));backdrop-filter:blur(20px)}

      <button data-case="A" class="on"><b>Case A · QR scan</b>Scent story on a shampoo bottle</button>
      <button data-case="B"><b>Case B · TikTok link</b>"Tell us about your day."</button>
      <button data-case="H"><b>Returning guest · Home</b>Rituals, services, booking</button>

<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const phone=$('#phone');
const S={case:'A',ing:0,mood:3,allergy:'None',allergens:[],mins:65,hist:[],cur:null,resume:null};

/* ---------- art ---------- */
const ING=[
 {k:'lemongrass',img:'assets/orb_lemongrass.png',name:'Lemongrass & rice',note:['Lemongrass'],txt:'Vietnamese lemongrass from Mekong gardens, softly steeped with rice. A green breath, a gentler pace.'},
 {k:'orange',img:'assets/orb_orange.png',name:'Orange',note:['Orange'],txt:'Sun-ripened Vietnamese orange peel, cold-pressed. A bright, sweet lift for slow mornings.'},
 {k:'lime',img:'assets/orb_lime.png',name:'Lime',note:['Lime'],txt:'Green lime zest, crisp and clean. A cooling note for a hot, heavy day.'}
];
ING.forEach(g=>{const i=new Image();i.src=g.img});
function wedges(flesh,rind,pith,n=9){let s=`<circle r="47" fill="${rind}"/><circle r="43" fill="${pith}"/>`;for(let i=0;i<n;i++){const a0=i/n*Math.PI*2+.07,a1=(i+1)/n*Math.PI*2-.07,R=38,r=5;const p=a=>[Math.sin(a)*R,-Math.cos(a)*R],q=a=>[Math.sin(a)*r,-Math.cos(a)*r];const A=p(a0),B=p(a1),C=q(a1),D=q(a0);s+=`<path d="M${D} L${A} A${R} ${R} 0 0 1 ${B} L${C}Z" fill="${flesh}" opacity="${.85+(i%3)*.05}"/>`}return `<svg viewBox="-50 -50 100 100">${s}</svg>`}

const order={q1:1,q2:2,q3:3};
const isQ=id=>/^q[123]$/.test(id);
let qbusy=false;
function go(id,dir=1,push=true){
  const qq=isQ(id);
  if(qq&&S.cur&&isQ(S.cur)){if(qbusy||id===S.cur)return;if(push)S.hist.push(S.cur);S.cur=id;S.resume=id;setStep(+id[1],true,dir);return}
  const cur=S.cur&&$('#'+(isQ(S.cur)?'qs':S.cur)), nxt=$('#'+(qq?'qs':id)); if(cur===nxt)return;
  if(cur){cur.classList.remove('on');cur.classList.toggle('out-l',dir>0);if(dir<0)cur.classList.remove('out-l')}
  nxt.classList.add('nt');nxt.classList.toggle('out-l',dir<0);nxt.offsetWidth;nxt.classList.remove('nt','out-l');nxt.classList.add('on');
  if(push&&S.cur)S.hist.push(S.cur);S.cur=id;
  if(qq){S.resume=id;setStep(+id[1],false)}
  else ({a1:initA1,o6:initO6,o7:initO7,resume:initResume,home:initHome,svc:initSvc,svcd:initSvcd,bk1:initBk1,bk2:initBk2,bk3:initBk3})[id]?.();

/* ---------- card stack ---------- */
const FRONT='translate(0px,0px) rotate(0deg) scale(1)';
const SLOT={1:'translate(-8px,-6px) rotate(3deg) scale(.98)',2:'translate(8px,6px) rotate(-3deg) scale(.98)'};
const qs={front:1,slot:{2:1,3:2}};
const cardEl=k=>$(`#qs .qcard[data-k="${k}"]`);
function paintCard(k){const c=cardEl(k),f=qs.front===k;c.classList.toggle('back',!f);c.classList.toggle('s2',!f&&qs.slot[k]===2);c.style.zIndex=f?5:(qs.slot[k]===1?3:2);c.style.transform=f?FRONT:SLOT[qs.slot[k]]}
function qDots(n){$$('#qdots i').forEach((d,i)=>d.className=i+1===n?'on':i+1<n?'done':'')}
function setStep(n,animate,dir=1){
  const from=qs.front;qDots(n);({1:initQ1,2:initQ2,3:initQ3})[n]();
  if(!animate||n===from){qs.front=n;qs.slot={};let sl=1;[1,2,3].filter(k=>k!==n).forEach(k=>qs.slot[k]=sl++);[1,2,3].forEach(paintCard);return}
  qbusy=true;const out=cardEl(from),inc=cardEl(n),s=qs.slot[n],D=1100,ease='cubic-bezier(.65,0,.35,1)';
  qs.slot[from]=s;delete qs.slot[n];qs.front=n;
  out.style.zIndex=6;inc.style.zIndex=5;
  const mk=(x,r)=>`translate(${x}%,${x?-3:0}%) rotate(${r}deg) scale(1)`;
  const a1=out.animate([{transform:FRONT},{transform:mk(dir*112,dir*8),offset:.45},{transform:SLOT[s]}],{duration:D,easing:ease,fill:'forwards'});
  const a2=inc.animate([{transform:SLOT[s]},{transform:mk(-dir*112,-dir*8),offset:.45},{transform:FRONT}],{duration:D,easing:ease,fill:'forwards'});
  setTimeout(()=>out.classList.add('back'),120);
  setTimeout(()=>{out.style.zIndex=1;inc.style.zIndex=7;inc.classList.remove('back')},D*.42);
  Promise.all([a1.finished,a2.finished]).then(()=>{[1,2,3].forEach(paintCard);a1.cancel();a2.cancel();qbusy=false});
}
const back=()=>{const p=S.hist.pop();if(p)go(p,-1,false)};
phone.addEventListener('click',e=>{

});

/* ---------- Q1 carousel ---------- */
const N=MOODS.length;let v=S.mood,tiles={};
const mod=(a,b)=>((a%b)+b)%b;
function place(el,d){const c=d===0,w=c?140:65,h=c?151:70;const off=[0,118.5,199.5,280][Math.abs(d)]*Math.sign(d);el.style.width=w+'px';el.style.height=h+'px';el.style.left=(175+off-w/2)+'px';el.style.top=(261-h/2)+'px';el.style.opacity=Math.abs(d)>=3?0:Math.abs(d)===2?.65:1;el.style.filter=c?'none':'saturate(.85)';el.style.zIndex=10-Math.abs(d)}
function renderCar(first){
  for(let p=v-3;p<=v+3;p++){let el=tiles[p];const d=p-v;
    if(!el){el=document.createElement('div');el.className='tile';el.innerHTML=face(mod(p,N));el.dataset.p=p;el.style.transition='none';place(el,d>0?3:-3);el.offsetWidth;el.style.transition='';tiles[p]=el;$('#track').appendChild(el)}
    el.classList.toggle('c',d===0);place(el,d)}
  for(const p in tiles)if(+p<v-3||+p>v+3){tiles[p].remove();delete tiles[p]}
  const m=MOODS[mod(v,N)];S.mood=mod(v,N);const box=$('#mood');
  const old=$('span:not(.o)',box);if(old&&!first){old.className='o';setTimeout(()=>old.remove(),400)}
  if(first)box.innerHTML='';
  const s=document.createElement('span');s.textContent=m.n;if(!first){s.className='o'}box.appendChild(s);if(!first){s.offsetWidth;s.classList.remove('o')}
  
}

{const tr=$('#atrack'),th=$('#athumb');let dr=false;const xOf=e=>{const r=tr.getBoundingClientRect();return Math.max(55,Math.min(294,(e.clientX-r.left)/(r.width/350)))};const near=x=>Object.entries(AST).reduce((b,c)=>Math.abs(c[1]-x)<Math.abs(b[1]-x)?c:b)[0];
 tr.addEventListener('pointerdown',e=>{dr=true;tr.setPointerCapture(e.pointerId);th.classList.add('drag');th.style.left=xOf(e)+'px'});
 tr.addEventListener('pointermove',e=>{if(!dr)return;const x=xOf(e);th.style.left=x+'px';const v=near(x);$$('#abig svg').forEach(i=>i.classList.toggle('on',i.dataset.v===v))});
 tr.addEventListener('pointerup',e=>{if(!dr)return;dr=false;th.classList.remove('drag');pickAlg(near(xOf(e)))});

/* ---------- Q3 dial ---------- */
const MARK=[[45,-135],[65,-45],[75,45],[90,135]];const CX=175,CY=137,R=105;
const pt=(a,r=R)=>[CX+r*Math.sin(a*Math.PI/180),CY-r*Math.cos(a*Math.PI/180)];
const arc=(a0,a1)=>{const [x0,y0]=pt(a0),[x1,y1]=pt(a1);return `M${x0} ${y0}A${R} ${R} 0 ${a1-a0>180?1:0} 1 ${x1} ${y1}`};
let ang=-45,shown=65,anim=0;
const minsAt=a=>{for(let i=0;i<3;i++){const [m0,a0]=MARK[i],[m1,a1]=MARK[i+1];if(a<=a1)return m0+(m1-m0)*Math.max(0,(a-a0)/(a1-a0))}return 90};
function paintDial(){const [kx,ky]=pt(ang);$('#dk').setAttribute('cx',kx);$('#dk').setAttribute('cy',ky);$('#dact').setAttribute('d',ang>-134.5?arc(-135,ang):'');$('#dnum').firstChild.nodeValue=Math.round(minsAt(ang));$$('.lab').forEach((l,i)=>l.classList.toggle('on',Math.abs(MARK[i][1]-ang)<8))}
function setMins(m,ms=650){S.mins=m;const to=MARK.find(x=>x[0]===m)[1],from=ang,t0=performance.now();cancelAnimationFrame(anim);const step=t=>{const k=Math.min(1,(t-t0)/ms),e=1-Math.pow(1-k,4);ang=from+(to-from)*e;paintDial();if(k<1)anim=requestAnimationFrame(step)};anim=requestAnimationFrame(step)}
function initQ3(){const d=$('#dial');d.innerHTML=`<svg width="350" height="300"><path d="${arc(-135,135)}" stroke="rgba(255,255,255,.35)" stroke-width="1" fill="none"/><path id="dact" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/><circle cx="${CX}" cy="${CY}" r="78" fill="rgba(246,240,230,.97)"/>${MARK.map(([m,a])=>{const [x,y]=pt(a);return `<circle cx="${x}" cy="${y}" r="4" fill="#fff" opacity=".8"/><circle class="hit" data-m="${m}" cx="${x}" cy="${y}" r="20" fill="transparent" style="cursor:pointer"/>`}).join('')}<circle id="dk" r="8" fill="#fff" stroke="rgba(0,0,0,.15)"/></svg><div class="num"><span id="dnum">65</span><small>MIN</small></div>${MARK.map(([m,a])=>{const [x,y]=pt(a,R+26);return `<div class="lab" data-m="${m}" style="left:${x}px;top:${y+(Math.abs(a)>100?8:-4)}px">${m} min</div>`}).join('')}`;
  ang=MARK.find(x=>x[0]===S.mins)[1];paintDial()}
$('#dial').addEventListener('click',e=>{const t=e.target.closest('[data-m]');if(t)setMins(+t.dataset.m)});
let drag=false;$('#dial').addEventListener('pointerdown',e=>{if(e.target.closest('#dk')){drag=true;$('#dial').setPointerCapture(e.pointerId);cancelAnimationFrame(anim)}});
$('#dial').addEventListener('pointermove',e=>{if(!drag)return;const r=$('#dial').getBoundingClientRect(),sc=r.width/350,x=(e.clientX-r.left)/sc-CX,y=(e.clientY-r.top)/sc-CY;let a=Math.atan2(x,-y)*180/Math.PI;a=Math.max(-135,Math.min(135,a));ang=a;paintDial()});
$('#dial').addEventListener('pointerup',()=>{if(!drag)return;drag=false;const n=MARK.reduce((b,m)=>Math.abs(m[1]-ang)<Math.abs(b[1]-ang)?m:b);setMins(n[0],350)});
